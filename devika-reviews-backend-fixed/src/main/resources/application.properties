spring.application.name=devika-reviews-backend

# ---------------------------------------------------------------------------
# MySQL connection
# Credentials are read from environment variables so nothing sensitive is
# hardcoded in this file. Defaults are only used for local convenience.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/devika_reviews?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Devikaa@@19_09_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# Admin API key for moderation endpoints (/api/admin/**)
# Set a real value via the ADMIN_API_KEY environment variable before running
# in any shared or production environment.
# ---------------------------------------------------------------------------
admin.api.key=${ADMIN_API_KEY:change-this-locally}

server.port=8080
