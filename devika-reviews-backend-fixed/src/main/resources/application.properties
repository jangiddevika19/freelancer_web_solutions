spring.application.name=devika-reviews-backend

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# Local:
# DB_URL can be omitted and this local URL will be used.
#
# Render:
# Set DB_URL to the TiDB Cloud JDBC URL in Render Environment Variables.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devika_reviews?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Devikaa@@19_09_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# Admin API key
# ---------------------------------------------------------------------------
admin.api.key=${ADMIN_API_KEY:change-this-locally}

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8080}